<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- Document Sheet -->
  <g filter="url(#shadow)">
    <!-- Main Page Body with folded top-right corner -->
    <path
      d="M18 12 H37 L48 23 V50 C48 51.657 46.657 53 45 53 H18 C16.343 53 15 51.657 15 50 V15 C15 13.343 16.343 12 18 12 Z"
      fill="#ffffff"
    />
    <!-- Folded Corner Flap -->
    <path
      d="M37 12 V21 C37 22.1 37.9 23 39 23 H48 Z"
      fill="url(#fold)"
    />
  </g>

  <!-- Resume Header Block / Avatar -->
  <rect x="20" y="18" width="6" height="6" rx="1.5" fill="#0284c7" />
  <rect x="28" y="19" width="8" height="2" rx="1" fill="#0f172a" />
  <rect x="28" y="22.5" width="6" height="1.5" rx="0.75" fill="#64748b" />

  <!-- Section Divider Accent -->
  <rect x="20" y="27.5" width="24" height="1.5" rx="0.75" fill="#0284c7" />

  <!-- Document Text Lines -->
  <rect x="20" y="32" width="24" height="2" rx="1" fill="#334155" />
  <rect x="20" y="37" width="18" height="2" rx="1" fill="#64748b" />
  <rect x="20" y="42" width="22" height="2" rx="1" fill="#64748b" />
  <rect x="20" y="47" width="14" height="2" rx="1" fill="#94a3b8" />
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0f6cbd" />
    <title>PlacementResume</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f3f3f3;
        color: #242424;
        font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        transition: opacity 240ms ease, visibility 240ms ease;
      }
      html.dark #app-preloader {
        background: #181818;
        color: #f5f5f5;
      }
      #app-preloader.is-loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px 32px;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid #e0e0e0;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      html.dark .preloader-card {
        background: #242424;
        border-color: #383838;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      .preloader-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #e0e0e0;
        border-top-color: #0f6cbd;
        animation: preloader-spin 0.75s linear infinite;
      }
      html.dark .preloader-spinner {
        border-color: #3d3d3d;
        border-top-color: #479ef5;
      }
      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media print {
        #app-preloader {
          display: none !important;
        }
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('resumeAppDarkMode') === 'true') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app-preloader" role="status" aria-live="polite" aria-label="Loading workspace">
      <div class="preloader-card">
        <div class="preloader-spinner"></div>
        <div style="text-align: center;">
          <div style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">
            PlacementResume
          </div>
          <div style="font-size: 11px; opacity: 0.7; margin-top: 2px;">
            Loading typography &amp; A4 canvas...
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
